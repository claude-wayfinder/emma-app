name: EmmaApp
options:
  bundleIdPrefix: ai.indahl
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  ElevenLabsSDK:
    url: https://github.com/elevenlabs/elevenlabs-swift
    from: "0.4.0"

targets:
  EmmaApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/EmmaApp
    dependencies:
      - package: ElevenLabsSDK
    info:
      path: Sources/EmmaApp/Info.plist
      properties:
        CFBundleName: Emma
        CFBundleDisplayName: Emma
        CFBundleIdentifier: ai.indahl.emma
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Emma uses your microphone for real-time voice conversations."
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.indahl.emma
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
